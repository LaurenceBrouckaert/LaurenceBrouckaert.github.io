const sky=document.getElementById('sky'),world=document.getElementById('world');
const BASE=200, GAP=330;             // wereldmaten in px
const HOLD=.55, MOVE=1.0, DIP=.55;   // seconden: stilstaan, vliegen; hoeveel er tussendoor uitgezoomd wordt
const C1=[[109,126,192],[155,179,218]], C2=[[143,129,178],[190,164,184]]; // lucht: blauw -> schemer
const lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],t))).join(',')+')';

const els=[],pos=[];
ITEMS.forEach((d,i)=>{
  const k=BASE/Math.max(d.w,d.h), w=d.w*k, h=d.h*k;
  const x=i*GAP, y=Math.sin(i*1.7)*38;
  const im=new Image(); im.src=d.src; im.width=w; im.height=h; im.draggable=false; im.alt='';
  world.appendChild(im); els.push(im); pos.push({x,y,w,h,ph:i*1.3});
});

let key=[],total=1;
function build(){
  const vw=innerWidth,vh=innerHeight;
  const zw=Math.min(vw/(4.2*GAP),vh/(BASE*2.2));                       // wijd beeld
  const close=pos.map(p=>({cx:p.x,cy:p.y,z:.84*Math.min(vw/p.w,vh/p.h)}));
  const mid=pos[Math.min(2,pos.length-1)].x, wide0={cx:mid,cy:0,z:zw};
  const last=close[close.length-1], wideL={cx:last.cx-GAP*1.5,cy:0,z:zw};
  key=[{...wide0,hold:.6}];
  close.forEach((c,i)=>key.push({...c,hold:HOLD,move:i===0?1.3:MOVE}));
  key.push({...wideL,hold:.5,move:1.6}); key.push({...wide0,hold:0,move:2.2,loop:true});
  total=key.reduce((s,k)=>s+(k.move||0)+k.hold,0);
}
function cam(t){
  t%=total; let prev=key[0];
  if(t<prev.hold) return prev;
  t-=prev.hold;
  for(let i=1;i<key.length;i++){
    const k=key[i];
    if(t<k.move){
      const s=t/k.move,e=ease(s),dip=Math.min(DIP,.6*Math.abs(Math.log(prev.z/k.z))+.35*(k.z<prev.z?0:0)+.0)||0;
      const d=(k.move>1.2&&k.loop)||(k.move>1.2&&i===key.length-2)?0:DIP;
      return {cx:lerp(prev.cx,k.cx,e),cy:lerp(prev.cy,k.cy,e),
        z:Math.exp(lerp(Math.log(prev.z),Math.log(k.z),e)-(prev.z===k.z?0:d)*Math.sin(Math.PI*s)*(prev.z>.0?1:0))};
    }
    t-=k.move; if(t<k.hold) return k; t-=k.hold; prev=k;
  }
  return prev;
}
let paused=false,tPlay=0,last=performance.now();
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function frame(now){
  const dt=(now-last)/1000; last=now;
  if(!paused&&!still) tPlay+=dt;
  const c=cam(tPlay),vw=innerWidth,vh=innerHeight;
  world.style.transform=`translate(${vw/2}px,${vh/2}px) scale(${c.z}) translate(${-c.cx}px,${-c.cy}px)`;
  const T=now/1000;
  els.forEach((im,i)=>{
    const p=pos[i],bob=Math.sin(T*.9+p.ph)*7,rot=Math.sin(T*.6+p.ph*1.7)*2.2;
    im.style.transform=`translate(${p.x-p.w/2}px,${p.y-p.h/2+bob}px) rotate(${rot}deg)`;
  });
  const sp=.5-.5*Math.cos(2*Math.PI*tPlay/total);        // lucht schuift van blauw naar schemer en terug
  sky.style.setProperty('--top',mix(C1[0],C2[0],sp)); sky.style.setProperty('--bot',mix(C1[1],C2[1],sp));
  requestAnimationFrame(frame);
}
addEventListener('resize',build); build();
sky.addEventListener('click',()=>{paused=!paused});   // tik om te pauzeren
requestAnimationFrame(frame);
</script>
