<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winkelmandje</title>
<style>
  /* Zet je fontbestand in /fonts (zie README-tip onderaan) */
  @font-face {
    font-family: "Big Noodle Titling";
    src: url("fonts/BigNoodleTitling-Oblique.woff2") format("woff2"),
         url("fonts/big_noodle_titling_oblique.ttf") format("truetype");
    font-style: oblique;
    font-weight: normal;
  }

  :root {
    --licht: #caf0ce;
    --groen: #98dc88;
    --wit: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--licht);
    color: var(--groen);
    font-family: "Big Noodle Titling", "Bebas Neue", Impact, sans-serif;
    font-style: oblique;
    text-transform: uppercase;
    overflow: hidden;
  }

  /* ---------- Scherm 1: lijst ---------- */
  #lijst {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 1vw;
  }
  #lijst button {
    all: unset; cursor: pointer; white-space: nowrap;
    line-height: .95; color: var(--groen); display: block;
  }
  #lijst button:hover { color: var(--wit); }

  /* ---------- Scherm 2 + 3: items verspreid ---------- */
  #veld {
    position: absolute; inset: 0;
    container-type: inline-size;
    display: none;
    transition: all .6s ease;
  }
  .item {
    position: absolute; cursor: pointer; line-height: 1;
  }
  .item .prijs { display: block; font-size: 1.3cqw; color: var(--groen); text-align: right; }
  .item .naam  { display: block; font-size: 4.2cqw; color: var(--wit); white-space: nowrap; }
  .item .notitie {
    display: block; font-size: 1.7cqw; color: var(--groen);
    white-space: nowrap; margin-left: 3cqw;
  }
  .item.rechts .notitie { text-align: right; margin: 0; }

  body.stap2 #lijst { display: none; }
  body.stap2 #veld, body.stap3 #veld { display: block; }
  body.stap3 #lijst { display: none; }

  /* ---------- Scherm 3: mandje ---------- */
  #mand {
    position: absolute; inset: 4% 12%;
    width: 76%; height: 92%;
    display: none;
  }
  body.stap3 #mand { display: block; }
  body.stap3 #veld {
    inset: auto;
    left: 31%; top: 46%; width: 40%; height: 38%;
  }

  /* ---------- Hint onderin ---------- */
  #hint {
    position: fixed; left: 1.5vw; bottom: 1.5vw;
    display: flex; align-items: center; gap: .8vw;
    color: #000; font-size: 1.4vw; pointer-events: none; z-index: 5;
  }
  #hint svg { width: 3vw; fill: var(--groen); }
  body.stap3 #hint { display: none; }
</style>
</head>
<body class="stap1">

<!-- Scherm 1 -->
<div id="lijst"></div>

<!-- Scherm 3: mandje-omtrek -->
<svg id="mand" viewBox="0 0 500 400" fill="none" stroke="#98dc88"
     stroke-width="10" stroke-linejoin="round" stroke-linecap="round"
     preserveAspectRatio="xMidYMid meet">
  <path d="M30 120 Q10 130 20 150 Q30 165 45 165 L75 330 Q80 355 105 360 L395 360 Q420 355 425 330 L455 165 Q470 165 480 150 Q490 130 470 120 Z"/>
  <path d="M130 120 L170 20 Q250 5 330 20 L370 120"/>
  <path d="M250 55 L290 115 L210 115 Z"/>
</svg>

<!-- Scherm 2 + 3 -->
<div id="veld"></div>

<div id="hint">
  <span id="hintTekst">Klik op een item</span>
  <svg viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 Z"/></svg>
</div>

<script>
  const items = [
    { naam: "Bruine suede jas", prijs: "139,00 euro", notitie: "Niet gekocht want te duur",
      pos: { left: "1%", top: "2%" } },
    { naam: "Gestreepte soft top rood en wit", prijs: "22,95 euro", notitie: "Niet gekocht want heb een koopverbod",
      pos: { left: "27%", top: "21%" } },
    { naam: "Milky toner", prijs: "9,99 euro", notitie: "Wil ik nog kopen dus wrs wel",
      pos: { left: "0%", top: "47%" } },
    { naam: "Zwarte sleehak pumps", prijs: "19,99 euro", notitie: "Oeps gekocht",
      pos: { left: "42%", top: "58%" }, rechts: true },
    { naam: "Bordeaux mascara", prijs: "4,99 euro", notitie: "Oeps gekocht",
      pos: { left: "0%", top: "78%" } }
  ];

  const lijst = document.getElementById("lijst");
  const veld  = document.getElementById("veld");
  const hint  = document.getElementById("hintTekst");

  // Scherm 1: lijst die de breedte vult
  const lijstNamen = ["Bruine suede jas", "Gestreepte soft top rood en wit",
                      "Milky toner MCO Beauty", "Zwarte sleehak pumps", "Bordeaux mascara"];
  lijstNamen.forEach(tekst => {
    const b = document.createElement("button");
    b.textContent = tekst;
    b.addEventListener("click", () => gaNaar(2));
    lijst.appendChild(b);
  });

  function pasLijstAan() {
    const breedte = lijst.clientWidth - 2 * parseFloat(getComputedStyle(lijst).paddingLeft);
    lijst.querySelectorAll("button").forEach(b => {
      b.style.fontSize = "100px";
      b.style.fontSize = (100 * breedte / b.scrollWidth) + "px";
    });
  }

  // Scherm 2: verspreide items
  items.forEach(it => {
    const d = document.createElement("div");
    d.className = "item" + (it.rechts ? " rechts" : "");
    Object.assign(d.style, it.pos);
    d.innerHTML = `<span class="prijs">${it.prijs}</span>
                   <span class="naam">${it.naam}</span>
                   <span class="notitie">${it.notitie}</span>`;
    d.addEventListener("click", () => gaNaar(document.body.classList.contains("stap2") ? 3 : 2));
    veld.appendChild(d);
  });

  function gaNaar(stap) {
    document.body.className = "stap" + stap;
    hint.textContent = stap === 2 ? "Klik op nog een item" : "Klik op een item";
    if (stap === 1) pasLijstAan();
  }

  // Op scherm 3 terug naar het begin
  document.body.addEventListener("click", e => {
    if (document.body.classList.contains("stap3") && !e.target.closest(".item")) gaNaar(1);
  });

  window.addEventListener("resize", pasLijstAan);
  document.fonts.ready.then(pasLijstAan);
  pasLijstAan();
</script>
</body>
</html>
